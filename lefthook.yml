# yaml-language-server: $schema=./node_modules/lefthook/schema.json
#
# Installed by the root `prepare` script (pnpm 10 does not run dependency postinstalls).
# Applies to Claude Code, Codex and humans alike. LEFTHOOK=0 bypasses; do not.
# Manual whole-repo run: pnpm hooks

pre-commit:
  piped: true
  skip:
    - merge
    - rebase
  jobs:
    - name: format
      run: pnpm format:check
      fail_text: 'Unformatted files. Run `pnpm format`, then stage the result.'
    - name: lint
      run: pnpm lint
      fail_text: 'oxlint or i18n:check reported problems.'
    - name: typecheck
      run: pnpm typecheck
      fail_text: 'tsc reported type errors.'

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
      fail_text: 'Conventional Commits, header <= 50 chars, no AI co-author trailers.'
