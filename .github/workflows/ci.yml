name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Git hooks never run inside CI; CI runs the same commands directly.
  LEFTHOOK: '0'
  ELECTRON_GET_NO_PROGRESS: '1'

jobs:
  ci:
    name: ci
    # Pinned: a new image can change what the sandbox black box needs (bwrap, AppArmor), so moving
    # it is a PR of its own that reruns spec 04's probe P5.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No AI co-author trailers
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if git log --format=%B "origin/${{ github.base_ref }}..HEAD" | grep -iE '^[[:space:]]*co-authored-by:.*(claude|codex|anthropic|openai|copilot|cursor|gemini)'; then
            echo "AI co-author trailer found in this pull request"; exit 1
          fi
      # pnpm must be on PATH before setup-node's `cache: pnpm` runs `pnpm store path`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # --ignore-scripts: this job never launches Electron, so skip its ~100 MB download.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Nested lint/format configs silently replace the root ones for their subtree.
      - name: No nested tool configs
        run: |
          nested="$(git ls-files | grep -E '/(\.oxlintrc\.json|\.oxfmtrc\.json|\.editorconfig)$' || true)"
          if [ -n "$nested" ]; then echo "nested configs found:"; echo "$nested"; exit 1; fi
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      # The sandbox black box (spec 04, acceptance 34) runs here for real: bubblewrap and friends,
      # and the AppArmor switch that lets an unprivileged user namespace start.
      - name: Install the sandbox's Linux dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Show the sandbox's host readings
        run: |
          for key in kernel/apparmor_restrict_unprivileged_userns kernel/unprivileged_userns_clone user/max_user_namespaces; do
            printf '%s = ' "$(echo "$key" | tr / .)"
            cat "/proc/sys/$key" 2>/dev/null || echo '(absent)'
          done
          bwrap --version
      - run: pnpm vitest run --maxWorkers=2 --reporter=default --reporter=json --outputFile.json=reports/vitest.json
        env:
          TENON_SANDBOX_TESTS: required
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
      - run: pnpm evals:gate --maxWorkers=2

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      # Electron ships its own Chromium; only the OS libraries are needed.
      - run: pnpm --filter @tenon-app/desktop exec playwright install-deps chromium
      - run: pnpm build
      - run: xvfb-run --auto-servernum pnpm test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: apps/desktop/reports/
          retention-days: 7
          if-no-files-found: ignore

  # The sandbox black box on macOS (spec 04, acceptance 34): only the sandbox suite and the stop
  # cases; every other unit test already runs in `ci`. Spec 05 adds the restore and preview unit
  # suites (filters match every `snapshot-restore*` and `snapshot-preview*` file; their
  # case-insensitive and Unicode-alias cases run only here) and the restore end-to-end
  # (acceptance 15); the rest of e2e runs on Linux only.
  sandbox-macos:
    name: sandbox-macos
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      # Spec 05 snapshots need git 2.43 or later; the image's default Xcode 16.4 ships 2.39.5 as
      # /usr/bin/git, so select a newer Xcode for the snapshot and restore tests.
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app && /usr/bin/git --version
      - run: pnpm vitest run --maxWorkers=2 --reporter=default --reporter=json --outputFile.json=reports/vitest-macos.json apps/desktop/test/sandbox/escape.test.ts apps/desktop/test/stop-tree.test.ts apps/desktop/test/snapshot-restore apps/desktop/test/snapshot-preview
        env:
          TENON_SANDBOX_TESTS: required
      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-
      # The install above skips scripts, so fetch Electron's binary here.
      - run: pnpm --filter @tenon-app/desktop exec install-electron
      # The runner's screen is smaller than the e2e window (1280x800); fit the window to it.
      - run: system_profiler SPDisplaysDataType | grep -i resolution || true
      - run: pnpm --filter @tenon-app/desktop exec playwright test e2e/restore.spec.ts e2e/write-card.spec.ts
        env:
          TENON_E2E_FIT_SCREEN: '1'

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-macos-report
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-macos-report
          path: apps/desktop/reports/
          retention-days: 7
          if-no-files-found: ignore

  spec-check:
    name: spec-check
    needs: [ci, e2e, sandbox-macos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: vitest-report
          path: reports
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: vitest-macos-report
          path: reports
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-report
          path: apps/desktop/reports
      - run: python3 .sdd/spec-check.py
      - if: ${{ github.event_name == 'pull_request' }}
        run: python3 .sdd/spec-check.py --red-on-base
      - if: ${{ github.event_name == 'pull_request' }}
        run: python3 .sdd/spec-check.py --mutants

  # The single required status check. A skipped job counts as passing on GitHub,
  # so this job fails unless every needed job actually succeeded.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [ci, e2e, sandbox-macos, spec-check]
    if: ${{ always() }}
    steps:
      - env:
          CI_RESULT: ${{ needs.ci.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SANDBOX_MACOS_RESULT: ${{ needs.sandbox-macos.result }}
          SPEC_CHECK_RESULT: ${{ needs.spec-check.result }}
        run: |
          echo "ci=$CI_RESULT e2e=$E2E_RESULT sandbox-macos=$SANDBOX_MACOS_RESULT spec-check=$SPEC_CHECK_RESULT"
          [ "$CI_RESULT" = "success" ] || exit 1
          [ "$E2E_RESULT" = "success" ] || exit 1
          [ "$SANDBOX_MACOS_RESULT" = "success" ] || exit 1
          [ "$SPEC_CHECK_RESULT" = "success" ] || exit 1
