name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Git hooks never run inside CI; CI runs the same commands directly.
  LEFTHOOK: '0'
  ELECTRON_GET_NO_PROGRESS: '1'

jobs:
  ci:
    name: ci
    # Pinned: a new image can change what the sandbox black box needs (bwrap, AppArmor), so moving
    # it is a PR of its own that reruns spec 04's probe P5.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No AI co-author trailers
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if git log --format=%B "origin/${{ github.base_ref }}..HEAD" | grep -iE '^[[:space:]]*co-authored-by:.*(claude|codex|anthropic|openai|copilot|cursor|gemini)'; then
            echo "AI co-author trailer found in this pull request"; exit 1
          fi
      # pnpm must be on PATH before setup-node's `cache: pnpm` runs `pnpm store path`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # --ignore-scripts: this job never launches Electron, so skip its ~100 MB download.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Nested lint/format configs silently replace the root ones for their subtree.
      - name: No nested tool configs
        run: |
          nested="$(git ls-files | grep -E '/(\.oxlintrc\.json|\.oxfmtrc\.json|\.editorconfig)$' || true)"
          if [ -n "$nested" ]; then echo "nested configs found:"; echo "$nested"; exit 1; fi
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      # The sandbox black box (spec 04, acceptance 34) runs here for real: bubblewrap and friends,
      # and the AppArmor switch that lets an unprivileged user namespace start.
      - name: Install the sandbox's Linux dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Show the sandbox's host readings
        run: |
          for key in kernel/apparmor_restrict_unprivileged_userns kernel/unprivileged_userns_clone user/max_user_namespaces; do
            printf '%s = ' "$(echo "$key" | tr / .)"
            cat "/proc/sys/$key" 2>/dev/null || echo '(absent)'
          done
          bwrap --version
      - run: pnpm test --maxWorkers=2
        env:
          TENON_SANDBOX_TESTS: required
      - run: pnpm evals:gate --maxWorkers=2

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      # Electron ships its own Chromium; only the OS libraries are needed.
      - run: pnpm --filter @tenon-app/desktop exec playwright install-deps chromium
      - run: pnpm build
      - run: xvfb-run --auto-servernum pnpm test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The sandbox black box on macOS (spec 04, acceptance 34): only the sandbox suite and the stop
  # cases; every other unit test already runs in `ci`.
  sandbox-macos:
    name: sandbox-macos
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm vitest run --maxWorkers=2 apps/desktop/test/sandbox/escape.test.ts apps/desktop/test/stop-tree.test.ts
        env:
          TENON_SANDBOX_TESTS: required

  # TEMPORARY (plan step 21): measurements on the runners; this whole block goes in the PR's last
  # commit. x64 S, the legacy x86-64 calls the observer reports, P2 on Linux, and a CI run of the
  # suite with the variable unset (the gate must fail it).
  tmp-probe-x64:
    name: tmp-probe-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TENON_CI_PROBE_OUT: ${{ runner.temp }}/probe-out
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: |
          uname -m
          bwrap --version
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - run: pnpm build
      - name: S on x64
        run: pnpm vitest run --maxWorkers=2 apps/desktop/test/sandbox/escape.test.ts apps/desktop/test/stop-tree.test.ts
        env:
          TENON_SANDBOX_TESTS: required
      - name: Gate, the suite without the variable under CI must fail
        if: ${{ !cancelled() }}
        run: |
          if env -u TENON_SANDBOX_TESTS pnpm vitest run apps/desktop/test/sandbox/escape.test.ts apps/desktop/test/stop-tree.test.ts; then
            echo "the gate did not fail the suite"; exit 1
          fi
      - name: Probe
        if: ${{ !cancelled() }}
        run: pnpm vitest run --maxWorkers=1 apps/desktop/test/sandbox/ci-probe.test.ts
        env:
          TENON_SANDBOX_TESTS: required
          TENON_CI_PROBE: '1'
      - name: Captured data
        if: ${{ !cancelled() }}
        run: |
          for f in "$TENON_CI_PROBE_OUT"/*.json; do echo "=== $f"; cat "$f"; done
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: probe-x64
          path: ${{ runner.temp }}/probe-out/
          if-no-files-found: warn

  tmp-probe-macos:
    name: tmp-probe-macos
    runs-on: macos-15
    timeout-minutes: 40
    env:
      TENON_CI_PROBE_OUT: ${{ runner.temp }}/probe-out
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Gate, the suite without the variable under CI must fail
        run: |
          if env -u TENON_SANDBOX_TESTS pnpm vitest run apps/desktop/test/sandbox/escape.test.ts apps/desktop/test/stop-tree.test.ts; then
            echo "the gate did not fail the suite"; exit 1
          fi
      - name: Probe
        run: pnpm vitest run --maxWorkers=1 apps/desktop/test/sandbox/ci-probe.test.ts
        env:
          TENON_SANDBOX_TESTS: required
          TENON_CI_PROBE: '1'
      - name: Captured data
        if: ${{ !cancelled() }}
        run: |
          for f in "$TENON_CI_PROBE_OUT"/*.json; do echo "=== $f"; cat "$f"; done
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: probe-macos
          path: ${{ runner.temp }}/probe-out/
          if-no-files-found: warn

  # The single required status check. A skipped job counts as passing on GitHub,
  # so this job fails unless every needed job actually succeeded.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [ci, e2e, sandbox-macos]
    if: ${{ always() }}
    steps:
      - env:
          CI_RESULT: ${{ needs.ci.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SANDBOX_MACOS_RESULT: ${{ needs.sandbox-macos.result }}
        run: |
          echo "ci=$CI_RESULT e2e=$E2E_RESULT sandbox-macos=$SANDBOX_MACOS_RESULT"
          [ "$CI_RESULT" = "success" ] || exit 1
          [ "$E2E_RESULT" = "success" ] || exit 1
          [ "$SANDBOX_MACOS_RESULT" = "success" ] || exit 1
