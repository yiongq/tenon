name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Git hooks never run inside CI; CI runs the same commands directly.
  LEFTHOOK: '0'
  ELECTRON_GET_NO_PROGRESS: '1'

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # pnpm must be on PATH before setup-node's `cache: pnpm` runs `pnpm store path`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # --ignore-scripts: this job never launches Electron, so skip its ~100 MB download.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Nested lint/format configs silently replace the root ones for their subtree.
      - name: No nested tool configs
        run: |
          nested="$(git ls-files | grep -E '/(\.oxlintrc\.json|\.oxfmtrc\.json|\.editorconfig)$' || true)"
          if [ -n "$nested" ]; then echo "nested configs found:"; echo "$nested"; exit 1; fi
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      # Electron ships its own Chromium; only the OS libraries are needed.
      - run: pnpm --filter @tenon-app/desktop exec playwright install-deps chromium
      - run: pnpm build
      - run: xvfb-run --auto-servernum pnpm test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The single required status check. A skipped job counts as passing on GitHub,
  # so this job fails unless every needed job actually succeeded.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [ci, e2e]
    if: ${{ always() }}
    steps:
      - env:
          CI_RESULT: ${{ needs.ci.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "ci=$CI_RESULT e2e=$E2E_RESULT"
          [ "$CI_RESULT" = "success" ] || exit 1
          [ "$E2E_RESULT" = "success" ] || exit 1
