name: Pages

# Publishes the OAuth client metadata document (CIMD) that Tenon's client_id points at
# (spec 03 §客户端身份, open question 1). Only that one file goes to the site; its URL is
# https://yiongq.github.io/tenon/oauth/client-metadata.json and must equal its client_id.
on:
  push:
    branches: [dev]
    paths:
      - apps/desktop/oauth/client-metadata.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}oauth/client-metadata.json
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site/oauth
          cp apps/desktop/oauth/client-metadata.json _site/oauth/client-metadata.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
